<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanVision AI — Cámara del vehículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161a; --panel: #1b2127; --line: #2b3440; --text: #eef1f4;
    --text-dim: #8b96a3; --accent: #3fc6c0; --ok: #4cc17e; --bad: #e25c4f;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }

  select, button {
    font-family: 'Manrope', sans-serif; font-size: 15px;
    width: 100%; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    margin-bottom: 10px;
  }
  button { background: var(--accent); color: #05201e; font-weight: 700; border: none; cursor: pointer; }
  button:disabled { opacity: 0.5; }

  #videoWrap { position: relative; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 4/3; margin-bottom: 14px; }
  video { width: 100%; height: 100%; object-fit: cover; }

  #statusBox { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 14px; }
  #statusBox .row { display:flex; justify-content:space-between; font-size: 13px; padding: 4px 0; }
  #statusBox .row b { color: var(--text); }
  #statusBox .row span.dim { color: var(--text-dim); }
  #sendDot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--text-dim); margin-right:6px; }
  #sendDot.on { background: var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Clean<span>Vision</span> AI — cámara del vehículo</h1>
  <p class="sub">Esta pantalla solo captura y envía — el panel completo se ve desde otro dispositivo.</p>

  <select id="deviceSelect"><option>Cargando cámaras…</option></select>
  <button id="startBtn">Iniciar</button>

  <div id="videoWrap"><video id="video" autoplay playsinline muted></video></div>
  <canvas id="canvas" style="display:none;"></canvas>

  <div id="statusBox">
    <div class="row"><span class="dim">Estado</span><b><span id="sendDot"></span><span id="statusText">Detenido</span></b></div>
    <div class="row"><span class="dim">Última clasificación</span><b id="lastClass">—</b></div>
    <div class="row"><span class="dim">Confianza</span><b id="lastConf">—</b></div>
    <div class="row"><span class="dim">Reportes enviados</span><b id="sentCount">0</b></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script src="/cart.js"></script>
</body>
</html>
